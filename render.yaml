services:
  - type: web
    name: cc3-autopost
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: CONFIG_JSON
        sync: false
